name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore frozen benchmark corpus
        run: python3 benchmark.py restore-corpus --output data/knowledge.sqlite
      - name: Validate benchmark labels and references
        run: python3 benchmark.py validate
      - name: Run regression tests
        run: python3 -m unittest -v
      - name: Validate held-out suite references
        run: python3 benchmark.py validate --suite benchmarks/heldout-v1/scenarios.json
      - name: Validate novel evaluation suite references
        run: python3 benchmark.py validate --suite benchmarks/novel-v1/scenarios.json
      - name: Validate mechanics evaluation suite references
        run: python3 benchmark.py validate --suite benchmarks/mechanics-v1/scenarios.json
      - name: Validate general questions suite references
        run: python3 benchmark.py validate --suite benchmarks/general-questions-v1/scenarios.json
      - name: Validate expanded general questions suite references
        run: python3 benchmark.py validate --suite benchmarks/general-questions-v2/scenarios.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check citation presentation
        run: node test_citations.mjs
